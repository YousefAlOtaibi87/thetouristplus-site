<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>TheTouristPlus hero</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(120% 140% at 85% 10%,#1E5BC6 0%,#0B3D91 45%,#072A66 100%);font-family:'Tajawal',sans-serif;color:#fff;display:flex;align-items:center;justify-content:center}
.wrap{display:flex;flex-direction:column;align-items:center;gap:2.2vh;text-align:center}
.logo{font:800 22vh/1 Arial,Helvetica,sans-serif;letter-spacing:-.02em;direction:ltr}
.brand{font:700 4.2vh/1 Arial,Helvetica,sans-serif;letter-spacing:.5em;color:#D6E2FA;direction:ltr;margin-right:-.5em}
.bar{width:26vh;height:1.1vh;border-radius:1vh;background:#C0392B}
.tag{font-weight:800;font-size:5.2vh;margin-top:2vh;line-height:1.35}
.sub{font-weight:500;font-size:3.4vh;color:#C9D8F5}
.plane{position:absolute;top:12vh;left:calc(50vw - 40vh);font-size:9vh;opacity:.18;transform:rotate(-12deg)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:3.2vh 3.2vh}
</style></head><body><div class="dots"></div><div class="plane">✈</div>
<div class="wrap"><div class="logo">T+</div><div class="brand">THETOURISTPLUS</div><div class="bar"></div>
<div class="tag">اطلب رحلتك<br>وشركاؤنا يوفرون أفضل الأسعار</div><div class="sub">thetouristplus.com</div></div></body></html>

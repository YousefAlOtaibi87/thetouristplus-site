<!doctype html><html><head><meta charset="utf-8"><title>TheTouristPlus cover</title><meta name="robots" content="noindex">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#1E5BC6 0%,#0B3D91 55%,#072A66 100%);position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1.5px,transparent 1.5px);background-size:3.2vh 3.2vh}
.box{position:absolute;top:0;bottom:0;left:calc(50vw - 50vh);width:100vh}
.logo{position:absolute;top:13vh;width:100%;text-align:center;font:800 17vh/1 Arial,Helvetica,sans-serif;color:#fff;letter-spacing:-.02em}
.bar{position:absolute;top:34vh;left:calc(50% - 10vh);width:20vh;height:1vh;border-radius:1vh;background:#C0392B}
.p{position:absolute;color:#fff;opacity:.16;font-size:6vh}
.trail{position:absolute;border-top:.35vh dashed rgba(255,255,255,.22);border-radius:50%}
</style></head><body><div class="dots"></div><div class="box">
<div class="trail" style="top:6vh;left:4vh;width:92vh;height:40vh"></div>
<div class="p" style="top:3vh;left:80vh;transform:rotate(15deg)">✈</div>
<div class="p" style="top:22vh;left:6vh;font-size:4vh;transform:rotate(-20deg)">✈</div>
<div class="logo">T+</div><div class="bar"></div></div></body></html>
